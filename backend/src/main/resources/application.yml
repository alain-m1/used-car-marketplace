# Production configuration for ECS Fargate. Every value below is injected by the
# ECS task definition (environment + SSM-backed secrets); nothing falls back to a
# local default, so a missing variable fails fast at startup instead of silently
# pointing at localhost.
#
# Required: SPRING_DATASOURCE_URL, DB_USERNAME, DB_PASSWORD (SSM secret), REDIS_HOST,
#           AWS_REGION, AWS_COGNITO_USER_POOL_ID, AWS_COGNITO_CLIENT_ID,
#           AWS_S3_BUCKET_NAME, CORS_ORIGINS
server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework   # behind the ALB

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}

  datasource:
    # e.g. jdbc:postgresql://<rds-endpoint>:5432/<db-name>
    url: ${SPRING_DATASOURCE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5   # db.t4g.micro has a small connection budget

  jpa:
    hibernate:
      # No migration tool ships with the repo yet. Switch to "validate" once
      # Flyway/Liquibase owns the schema.
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false

  data:
    redis:
      # Redis runs as a sidecar container in the same Fargate task: REDIS_HOST=localhost
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

app:
  cors:
    allowed-origins: ${CORS_ORIGINS}

aws:
  region: ${AWS_REGION:us-east-2}
  cognito:
    user-pool-id: ${AWS_COGNITO_USER_POOL_ID}
    client-id: ${AWS_COGNITO_CLIENT_ID}
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
