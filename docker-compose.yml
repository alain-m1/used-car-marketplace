# docker-compose.yml
services:
  # PostgreSQL Database
  postgres:
    image: postgres:15.4-alpine
    container_name: car-marketplace-postgres
    restart: unless-stopped
    environment:
      # Database Configuration (matches k8s postgres-config)
      POSTGRES_DB: car_marketplace
      POSTGRES_USER: carmarket_user
      # Local-only default. In AWS the password comes from SSM Parameter Store
      # (/car-marketplace/development/db-password), never from this file.
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password123}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - car-marketplace-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carmarket_user -d car_marketplace"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Redis Cache
  # AWS mapping: becomes a sidecar container (redis:7.2-alpine, essential: true)
  # in the backend ECS task on FARGATE_SPOT. Cache is disposable, so no volume.
  redis:
    image: redis:7.2-alpine
    container_name: car-marketplace-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - car-marketplace-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend Application
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: car-marketplace-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Database Configuration
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: car_marketplace
      DB_USERNAME: carmarket_user
      DB_PASSWORD: ${DB_PASSWORD:-password123}  # ECS: injected via task-definition Secrets (SSM)

      # Redis Configuration
      # Local: the redis service below. On ECS the same redis:7.2-alpine image runs
      # as a Fargate Spot sidecar in the backend task (awsvpc shares localhost),
      # so set REDIS_HOST=localhost in the task definition. No ElastiCache.
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: 6379

      # Application Configuration
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: docker
      LOG_LEVEL: INFO

      # JWT Configuration
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_for_car_marketplace_development}
      JWT_EXPIRATION: 86400

      # CORS Configuration
      CORS_ORIGINS: http://localhost:3000,http://frontend:80

      # AWS Configuration (for local development)
      AWS_REGION: us-east-2
      AWS_DEFAULT_REGION: us-east-2
      AWS_ACCESS_KEY_ID: localstack
      AWS_SECRET_ACCESS_KEY: localstack
      AWS_S3_BUCKET_NAME: car-marketplace-images-local
      AWS_COGNITO_USER_POOL_ID: local-pool
      AWS_COGNITO_CLIENT_ID: local-client

      # File Upload Configuration
      UPLOAD_PATH: /app/uploads
      MAX_FILE_SIZE: 10MB
    ports:
      - "8080:8080"
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    networks:
      - car-marketplace-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: car-marketplace-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Local only: nginx proxies /api/ to API_UPSTREAM. In AWS leave it unset;
      # the ALB listener rule /api/* -> backend target group does the routing.
      API_UPSTREAM: http://backend:8080
      NGINX_RESOLVER: 127.0.0.11
      REACT_APP_API_URL: http://localhost:8080/api/v1
      REACT_APP_ENVIRONMENT: docker
      REACT_APP_VERSION: 1.0.0
    ports:
      - "3000:80"
    networks:
      - car-marketplace-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MinIO (S3-compatible storage for local development)
  minio:
    image: minio/minio:latest
    container_name: car-marketplace-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DEFAULT_BUCKETS: car-marketplace-images-local
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - car-marketplace-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Prometheus (Metrics Collection)
  prometheus:
    image: prom/prometheus:latest
    container_name: car-marketplace-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - car-marketplace-network
    profiles:
      - monitoring

  # Grafana (Metrics Visualization)
  grafana:
    image: grafana/grafana:latest
    container_name: car-marketplace-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: false
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - car-marketplace-network
    profiles:
      - monitoring

  # Jaeger (Distributed Tracing)
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: car-marketplace-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: true
    ports:
      - "16686:16686"  # Jaeger UI
      - "14268:14268"  # HTTP collector
      - "14250:14250"  # gRPC collector
    networks:
      - car-marketplace-network
    profiles:
      - monitoring

  # ELK Stack for Logging (optional)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: car-marketplace-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - car-marketplace-network
    profiles:
      - logging

  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    container_name: car-marketplace-logstash
    restart: unless-stopped
    depends_on:
      - elasticsearch
    volumes:
      - ./logging/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    networks:
      - car-marketplace-network
    profiles:
      - logging

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: car-marketplace-kibana
    restart: unless-stopped
    depends_on:
      - elasticsearch
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - car-marketplace-network
    profiles:
      - logging

  # NGINX Load Balancer (for multiple backend instances)
  nginx:
    image: nginx:alpine
    container_name: car-marketplace-nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    networks:
      - car-marketplace-network
    profiles:
      - production

  # Backup Service
  backup:
    image: postgres:15.4-alpine
    container_name: car-marketplace-backup
    restart: "no"
    depends_on:
      - postgres
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: car_marketplace
      PGUSER: carmarket_user
      PGPASSWORD: ${DB_PASSWORD:-password123}
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    command: /backup.sh
    networks:
      - car-marketplace-network
    profiles:
      - backup

# Volumes
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_uploads:
    driver: local
  backend_logs:
    driver: local
  minio_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  elasticsearch_data:
    driver: local
  nginx_logs:
    driver: local

# Networks
networks:
  car-marketplace-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
